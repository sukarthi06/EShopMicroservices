name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name eshopkarthiacr

      - name: Build & Push Docker Images
        run: |
          set -e
          ACR_NAME=eshopkarthiacr
          TAG=latest

          echo "Building catalog.api"
          docker build -f src/Services/Catalog/Catalog.Api/Dockerfile -t $ACR_NAME.azurecr.io/catalog.api:$TAG .
          docker push $ACR_NAME.azurecr.io/catalog.api:$TAG

          echo "Building basket.api"
          docker build -f src/Services/Basket/Basket.Api/Dockerfile -t $ACR_NAME.azurecr.io/basket.api:$TAG .
          docker push $ACR_NAME.azurecr.io/basket.api:$TAG

          echo "Building discount.grpc"
          docker build -f src/Services/Discount/Discount.Grpc/Dockerfile -t $ACR_NAME.azurecr.io/discount.grpc:$TAG .
          docker push $ACR_NAME.azurecr.io/discount.grpc:$TAG

          echo "Building ordering.api"
          docker build -f src/Services/Ordering/Ordering.Api/Dockerfile -t $ACR_NAME.azurecr.io/ordering.api:$TAG .
          docker push $ACR_NAME.azurecr.io/ordering.api:$TAG

          echo "Building yarp.gateway"
          docker build -f src/ApiGateways/YarpApiGateway/Dockerfile -t $ACR_NAME.azurecr.io/yarp.gateway:$TAG .
          docker push $ACR_NAME.azurecr.io/yarp.gateway:$TAG

          echo "Building eshop.ui"
          docker build -f client/eshop-app/Dockerfile -t $ACR_NAME.azurecr.io/eshop.ui:$TAG .
          docker push $ACR_NAME.azurecr.io/eshop.ui:$TAG

      - name: Deploy to Azure Container Apps
        run: |
          RG=rg-eshop-prod
          ENV=eshop-env
          ACR=eshopkarthiacr
          TAG=latest

          az containerapp up \
            --name catalog-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/catalog.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          az containerapp up \
            --name basket-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/basket.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          az containerapp up \
            --name discount-grpc \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/discount.grpc:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          az containerapp up \
            --name ordering-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/ordering.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          az containerapp up \
            --name yarp-gateway \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/yarp.gateway:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress external \
            --target-port 8080

          az containerapp up \
            --name eshop-ui \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/eshop.ui:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress external \
            --target-port 80
