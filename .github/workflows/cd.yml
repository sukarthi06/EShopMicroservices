name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: eshopkarthiacr.azurecr.io

      - name: Build & Push .NET APIs
        run: |
          set -e
          ACR_NAME=eshopkarthiacr
          TAG=latest

          # --- Catalog API ---
          docker build -f src/Services/Catalog/Catalog.Api/Dockerfile -t $ACR_NAME.azurecr.io/catalog.api:$TAG src
          docker push $ACR_NAME.azurecr.io/catalog.api:$TAG

          # --- Basket API ---
          docker build -f src/Services/Basket/Basket.Api/Dockerfile -t $ACR_NAME.azurecr.io/basket.api:$TAG src
          docker push $ACR_NAME.azurecr.io/basket.api:$TAG

          # --- Discount gRPC ---
          docker build -f src/Services/Discount/Discount.Grpc/Dockerfile -t $ACR_NAME.azurecr.io/discount.grpc:$TAG src
          docker push $ACR_NAME.azurecr.io/discount.grpc:$TAG

          # --- Ordering API ---
          docker build -f src/Services/Ordering/Ordering.Api/Dockerfile -t $ACR_NAME.azurecr.io/ordering.api:$TAG src
          docker push $ACR_NAME.azurecr.io/ordering.api:$TAG

          # --- YARP Gateway ---
          docker build -f src/ApiGateways/YarpApiGateway/Dockerfile -t $ACR_NAME.azurecr.io/yarp.gateway:$TAG src
          docker push $ACR_NAME.azurecr.io/yarp.gateway:$TAG

      - name: Build & Push Angular UI
        run: |
          set -e
          ACR_NAME=eshopkarthiacr
          TAG=latest

          docker build -f client/eshop-app/Dockerfile -t $ACR_NAME.azurecr.io/eshop.ui:$TAG client/eshop-app
          docker push $ACR_NAME.azurecr.io/eshop.ui:$TAG

      - name: Deploy to Azure Container Apps
        run: |
          RG=rg-eshop-prod
          ENV=eshop-env
          ACR=eshopkarthiacr
          TAG=latest

          # --- Catalog API ---
          az containerapp up \
            --name catalog-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/catalog.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          # --- Basket API ---
          az containerapp up \
            --name basket-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/basket.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          # --- Discount gRPC ---
          az containerapp up \
            --name discount-grpc \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/discount.grpc:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          # --- Ordering API ---
          az containerapp up \
            --name ordering-api \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/ordering.api:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress internal \
            --target-port 8080

          # --- YARP Gateway ---
          az containerapp up \
            --name yarp-gateway \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/yarp.gateway:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress external \
            --target-port 8080

          # --- Angular UI ---
          az containerapp up \
            --name eshop-ui \
            --resource-group $RG \
            --environment $ENV \
            --image $ACR.azurecr.io/eshop.ui:$TAG \
            --registry-server $ACR.azurecr.io \
            --ingress external \
            --target-port 80
