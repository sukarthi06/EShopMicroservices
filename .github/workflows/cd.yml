name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write  # For OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Azure OIDC login
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3️⃣ Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 4️⃣ Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5️⃣ Install Angular CLI 21
      - name: Install Angular CLI
        run: npm install -g @angular/cli@21

      # 6️⃣ Define services (Container App Name | Image Name | Dockerfile Path | Build Context)
      - name: Set services
        id: services
        run: |
          echo "SERVICES<<EOF" >> $GITHUB_ENV
          echo "catalog-api|catalog.api|./src/Services/Catalog/Catalog.Api/Dockerfile|./src/Services/Catalog/Catalog.Api" >> $GITHUB_ENV
          echo "basket-api|basket.api|./src/Services/Basket/Basket.Api/Dockerfile|./src/Services/Basket/Basket.Api" >> $GITHUB_ENV
          echo "discount-grpc|discount.grpc|./src/Services/Discount/Discount.Grpc/Dockerfile|./src/Services/Discount/Discount.Grpc" >> $GITHUB_ENV
          echo "ordering-api|ordering.api|./src/Services/Ordering/Ordering.Api/Dockerfile|./src/Services/Ordering/Ordering.Api" >> $GITHUB_ENV
          echo "yarp-api-gateway|yarpapigateway|./ApiGateways/YarpApiGateway/Dockerfile|./ApiGateways/YarpApiGateway" >> $GITHUB_ENV
          echo "eshop-ui|eshop.ui|./client/eshop-app/Dockerfile|./client/eshop-app" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 7️⃣ Build and push Docker images
      - name: Build and push Docker images
        run: |
          ACR_NAME=eshopkarthiacr
          IMAGE_TAG=latest

          az acr login --name $ACR_NAME

          echo "$SERVICES" | while IFS="|" read CONTAINER IMAGE DOCKERFILE CONTEXT
          do
            echo "Building $IMAGE from $DOCKERFILE"
            docker build "$CONTEXT" -f "$DOCKERFILE" -t "$ACR_NAME.azurecr.io/$IMAGE:$IMAGE_TAG"
            docker push "$ACR_NAME.azurecr.io/$IMAGE:$IMAGE_TAG"
          done

      # 8️⃣ Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          RG_NAME=rg-eshop-prod
          ENV_NAME=eshop-env
          IMAGE_TAG=latest

          # Ensure environment exists
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RG_NAME \
            --location eastus

          echo "$SERVICES" | while IFS="|" read CONTAINER IMAGE DOCKERFILE CONTEXT
          do
            echo "Deploying $CONTAINER from $IMAGE:$IMAGE_TAG"
            az containerapp up \
              --name $CONTAINER \
              --resource-group $RG_NAME \
              --image eshopkarthiacr.azurecr.io/$IMAGE:$IMAGE_TAG \
              --environment $ENV_NAME \
              --cpu 0.5 --memory 1.0Gi \
              --registry-server eshopkarthiacr.azurecr.io \
              --ingress 'internal' \
              --target-port 8080 \
              || echo "$CONTAINER may already exist, updating image"
          done
