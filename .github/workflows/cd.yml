name: CD

# Trigger manually or on push to main
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Azure using OIDC
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3️⃣ Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 4️⃣ Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5️⃣ Install Angular CLI 21
      - name: Install Angular CLI
        run: npm install -g @angular/cli@21

      # 6️⃣ Build & push Docker images
      - name: Build and push Docker images
        run: |
          set -e
          IMAGE_TAG=latest
          ACR_NAME=eshopkarthiacr

          # Login to ACR
          az acr login --name $ACR_NAME

          # List of services & corresponding Dockerfile paths
          declare -A services=(
            ["catalog.api"]="src/Services/Catalog/Catalog.Api/Dockerfile"
            ["basket.api"]="src/Services/Basket/Basket.Api/Dockerfile"
            ["discount.grpc"]="src/Services/Discount/Discount.Grpc/Dockerfile"
            ["ordering.api"]="src/Services/Ordering/Ordering.Api/Dockerfile"
            ["yarpapigateway"]="ApiGateways/YarpApiGateway/Dockerfile"
            ["eshop.ui"]="client/eshop-app/Dockerfile"
          )

          # Loop through services
          for svc in "${!services[@]}"; do
            echo "Building $svc from ${services[$svc]}"
            docker build -f ${services[$svc]} -t $ACR_NAME.azurecr.io/$svc:$IMAGE_TAG .
            docker push $ACR_NAME.azurecr.io/$svc:$IMAGE_TAG
          done

      # 7️⃣ Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          set -e
          RG_NAME=rg-eshop-prod
          ENV_NAME=eshop-env
          IMAGE_TAG=latest
          ACR_NAME=eshopkarthiacr

          # Create environment if missing
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RG_NAME \
            --location eastus || true

          # Deploy each container app
          declare -A apps=(
            ["catalog-api"]="catalog.api"
            ["basket-api"]="basket.api"
            ["discount-grpc"]="discount.grpc"
            ["ordering-api"]="ordering.api"
            ["yarp-api-gateway"]="yarpapigateway"
            ["eshop-ui"]="eshop.ui"
          )

          for app in "${!apps[@]}"; do
            echo "Deploying $app → ${apps[$app]}"
            az containerapp up \
              --name $app \
              --resource-group $RG_NAME \
              --image $ACR_NAME.azurecr.io/${apps[$app]}:$IMAGE_TAG \
              --environment $ENV_NAME \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server $ACR_NAME.azurecr.io \
              --ingress 'internal' \
              --target-port 8080 || true
          done
