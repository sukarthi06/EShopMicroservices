name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: eshopkarthiacr
      IMAGE_TAG: latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Azure via OIDC
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3️⃣ Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 4️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5️⃣ Install Angular CLI
      - name: Install Angular CLI
        run: npm install -g @angular/cli@21

      # 6️⃣ Login to ACR
      - name: Login to Azure Container Registry
        run: az acr login --name $ACR_NAME

      # 7️⃣ Build & push all services using Docker Compose
      - name: Build & push all services
        run: |
          set -e
          COMPOSE_FILE="composer/docker-compose.yml"

          for svc in catalog.api basket.api discount.grpc ordering.api yarpapigateway eshop.ui; do
            echo "Building $svc"
            docker compose -f $COMPOSE_FILE build $svc
      
            echo "Tagging & pushing $svc"
            docker tag $svc $ACR_NAME.azurecr.io/$svc:$IMAGE_TAG
            docker push $ACR_NAME.azurecr.io/$svc:$IMAGE_TAG
          done

      # 8️⃣ Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          set -e
          RG_NAME=rg-eshop-prod
          ENV_NAME=eshop-env

          # Ensure environment exists
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RG_NAME \
            --location eastus || true

          # Deploy APIs & UI
          for app in catalog-api basket-api discount-grpc ordering-api yarp-api-gateway eshop-ui; do
            IMAGE="$ACR_NAME.azurecr.io/$app:$IMAGE_TAG"
            echo "Deploying $app → $IMAGE"
            az containerapp up \
              --name $app \
              --resource-group $RG_NAME \
              --image $IMAGE \
              --environment $ENV_NAME \
              --cpu 0.5 --memory 1.0Gi \
              --registry-server $ACR_NAME.azurecr.io \
              --ingress 'internal' || true
          done
