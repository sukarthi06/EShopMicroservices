<div class="card">
  <a [routerLink]="['/productdetail', product.id]">
    <img class="card-img-top"
         [src]="imageUrl()"
         [alt]="product.name">
  </a>

  <div class="card-body">
    <h4 class="card-title">
      <a class="color-main"
         [routerLink]="['/productdetail', product.id]">
        {{ product.name }}
      </a>
    </h4>

    <p class="card-text">
      {{ product.description }}
    </p>

    <div class="row">
      <div style="width: 40%;margin-left: 5px;">
        <p class="btn btn-danger btn-block">
          {{ product.price }} $
        </p>
      </div>

      <div style="width: 50%;margin-left: 5px;">
        <button type="button"
                class="btn btn-success btn-block"
                [disabled]="isLoading"
                (click)="addToCart()">
                @if(isLoading) {
                  <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                  Adding...
                } @else {
                  Add to Cart
                }
        </button>
      </div>
    </div>
  </div>
</div>
