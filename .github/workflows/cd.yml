name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Azure login via OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to ACR
      - name: ACR Login
        run: az acr login --name eshopkarthiacr

      # -------------------------
      # BUILD & PUSH IMAGES
      # -------------------------

      - name: Build & Push Catalog API
        run: |
          docker build ./src/Services/Catalog/Catalog.Api \
            -f ./src/Services/Catalog/Catalog.Api/Dockerfile \
            -t eshopkarthiacr.azurecr.io/catalog.api:latest
          docker push eshopkarthiacr.azurecr.io/catalog.api:latest

      - name: Build & Push Basket API
        run: |
          docker build ./src/Services/Basket/Basket.Api \
            -f ./src/Services/Basket/Basket.Api/Dockerfile \
            -t eshopkarthiacr.azurecr.io/basket.api:latest
          docker push eshopkarthiacr.azurecr.io/basket.api:latest

      - name: Build & Push Discount Grpc
        run: |
          docker build ./src/Services/Discount/Discount.Grpc \
            -f ./src/Services/Discount/Discount.Grpc/Dockerfile \
            -t eshopkarthiacr.azurecr.io/discount.grpc:latest
          docker push eshopkarthiacr.azurecr.io/discount.grpc:latest

      - name: Build & Push Ordering API
        run: |
          docker build ./src/Services/Ordering/Ordering.Api \
            -f ./src/Services/Ordering/Ordering.Api/Dockerfile \
            -t eshopkarthiacr.azurecr.io/ordering.api:latest
          docker push eshopkarthiacr.azurecr.io/ordering.api:latest

      - name: Build & Push YARP Gateway
        run: |
          docker build ./ApiGateways/YarpApiGateway \
            -f ./ApiGateways/YarpApiGateway/Dockerfile \
            -t eshopkarthiacr.azurecr.io/yarpapigateway:latest
          docker push eshopkarthiacr.azurecr.io/yarpapigateway:latest

      - name: Build & Push Angular UI
        run: |
          docker build ./client/eshop-app \
            -f ./client/eshop-app/Dockerfile \
            -t eshopkarthiacr.azurecr.io/eshop.ui:latest
          docker push eshopkarthiacr.azurecr.io/eshop.ui:latest

      # -------------------------
      # DEPLOY TO CONTAINER APPS
      # -------------------------

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp env create \
            --name eshop-env \
            --resource-group rg-eshop-prod \
            --location eastus || true

          az containerapp up \
            --name catalog-api \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/catalog.api:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress internal || true

          az containerapp up \
            --name basket-api \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/basket.api:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress internal || true

          az containerapp up \
            --name discount-grpc \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/discount.grpc:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress internal || true

          az containerapp up \
            --name ordering-api \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/ordering.api:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress internal || true

          az containerapp up \
            --name yarp-api-gateway \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/yarpapigateway:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress external || true

          az containerapp up \
            --name eshop-ui \
            --resource-group rg-eshop-prod \
            --environment eshop-env \
            --image eshopkarthiacr.azurecr.io/eshop.ui:latest \
            --registry-server eshopkarthiacr.azurecr.io \
            --ingress external || true
