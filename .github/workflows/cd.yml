name: CD

# Trigger manually or automatically on push to main
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Azure via OIDC
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3️⃣ Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 4️⃣ Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5️⃣ Install Angular CLI 21
      - name: Install Angular CLI
        run: npm install -g @angular/cli@21

      # 6️⃣ Build & push Docker images
      - name: Build and push Docker images
        run: |
          set -e
          ACR_NAME=eshopkarthiacr
          IMAGE_TAG=latest

          # Login to ACR
          az acr login --name $ACR_NAME

          # -------- APIs --------
          for service in catalog basket discount ordering yarp; do
            SRC_PATH=""
            DOCKERFILE=""
            IMAGE_NAME=""

            case $service in
              catalog)
                SRC_PATH="./src/Services/Catalog/Catalog.Api"
                DOCKERFILE="$SRC_PATH/Dockerfile"
                IMAGE_NAME="catalog.api"
                ;;
              basket)
                SRC_PATH="./src/Services/Basket/Basket.Api"
                DOCKERFILE="$SRC_PATH/Dockerfile"
                IMAGE_NAME="basket.api"
                ;;
              discount)
                SRC_PATH="./src/Services/Discount/Discount.Grpc"
                DOCKERFILE="$SRC_PATH/Dockerfile"
                IMAGE_NAME="discount.grpc"
                ;;
              ordering)
                SRC_PATH="./src/Services/Ordering/Ordering.Api"
                DOCKERFILE="$SRC_PATH/Dockerfile"
                IMAGE_NAME="ordering.api"
                ;;
              yarp)
                SRC_PATH="./ApiGateways/YarpApiGateway"
                DOCKERFILE="$SRC_PATH/Dockerfile"
                IMAGE_NAME="yarpapigateway"
                ;;
            esac

            echo "Building $IMAGE_NAME from $SRC_PATH"
            docker build "$SRC_PATH" -f "$DOCKERFILE" -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
            docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
          done

          # -------- Angular UI --------
          UI_PATH="./client/eshop-app"
          docker build -f $UI_PATH/Dockerfile -t $ACR_NAME.azurecr.io/eshop.ui:$IMAGE_TAG $UI_PATH
          docker push $ACR_NAME.azurecr.io/eshop.ui:$IMAGE_TAG

      # 7️⃣ Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          set -e
          RG_NAME=rg-eshop-prod
          ENV_NAME=eshop-env
          ACR_NAME=eshopkarthiacr
          IMAGE_TAG=latest

          # Ensure environment exists
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RG_NAME \
            --location eastus || true

          # Deploy APIs & UI
          for app in catalog-api basket-api discount-grpc ordering-api yarp-api-gateway eshop-ui; do
            IMAGE=""
            case $app in
              catalog-api) IMAGE="$ACR_NAME.azurecr.io/catalog.api:$IMAGE_TAG" ;;
              basket-api) IMAGE="$ACR_NAME.azurecr.io/basket.api:$IMAGE_TAG" ;;
              discount-grpc) IMAGE="$ACR_NAME.azurecr.io/discount.grpc:$IMAGE_TAG" ;;
              ordering-api) IMAGE="$ACR_NAME.azurecr.io/ordering.api:$IMAGE_TAG" ;;
              yarp-api-gateway) IMAGE="$ACR_NAME.azurecr.io/yarpapigateway:$IMAGE_TAG" ;;
              eshop-ui) IMAGE="$ACR_NAME.azurecr.io/eshop.ui:$IMAGE_TAG" ;;
            esac

            echo "Deploying $app → $IMAGE"
            az containerapp up \
              --name $app \
              --resource-group $RG_NAME \
              --image $IMAGE \
              --environment $ENV_NAME \
              --cpu 0.5 --memory 1.0Gi \
              --registry-server $ACR_NAME.azurecr.io \
              --ingress 'internal' || true
          done
